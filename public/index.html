<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda Nutri Semillas</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow"></p>
        <h1>Tienda Nutri Semillas</h1>
      </div>
      <nav class="nav" aria-label="Navegación de páginas">
        <button class="nav-link active" type="button" data-page="catalogo" aria-current="page">Catálogo</button>
        <button class="nav-link" type="button" data-page="carrito" aria-label="Carrito de compras">
          <span class="nav-icon">🛒</span>
          <span class="badge" id="cart-badge">0</span>
        </button>
        <button class="nav-link" type="button" data-page="admin" aria-label="Administración">
          <span class="nav-icon">⚙️</span>
          <span class="badge" id="admin-badge">0</span>
        </button>
      </nav>
    </header>

    <main>
      <section class="summary-band" aria-label="Resumen de tienda">
        <div>
          <strong id="product-count">0</strong>
          <span>productos activos</span>
        </div>
        <div>
          <strong id="cart-count">0</strong>
          <span>unidades en carrito</span>
        </div>
        <div>
          <strong id="cart-total-mini">Q0.00</strong>
          <span>total actual</span>
        </div>
      </section>

      <section id="catalogo" class="workspace">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Catalogo</p>
            <h2>Productos por 1/2 libra</h2>
          </div>
          <div class="toolbar">
            <input id="search" type="search" placeholder="Buscar producto o categoria">
            <select id="category-filter" aria-label="Filtrar por categoria">
              <option value="">Todas las categorias</option>
            </select>
            <select id="sort" aria-label="Ordenar productos">
              <option value="name-asc">Nombre A-Z</option>
              <option value="name-desc">Nombre Z-A</option>
              <option value="price-asc">Precio menor</option>
              <option value="price-desc">Precio mayor</option>
              <option value="category-asc">Categoria A-Z</option>
            </select>
          </div>
        </div>
        <div id="products-grid" class="products-grid"></div>
      </section>

      <section id="carrito" class="workspace split hidden">
        <div>
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Compra</p>
              <h2>Carrito</h2>
            </div>
            <button id="clear-cart" class="secondary-button" type="button">Vaciar</button>
          </div>
          <div id="cart-items" class="cart-list"></div>
        </div>
        <aside class="checkout-panel" aria-label="Resumen del carrito">
          <h3>Resumen</h3>
          <dl>
            <div>
              <dt>Subtotal</dt>
              <dd id="cart-subtotal">Q0.00</dd>
            </div>
            <div>
              <dt>Productos</dt>
              <dd id="cart-lines">0</dd>
            </div>
            <div>
              <dt>Total</dt>
              <dd id="cart-total">Q0.00</dd>
            </div>
          </dl>
          <button id="checkout" type="button">Confirmar compra</button>
        </aside>
      </section>

      <section id="admin" class="workspace hidden">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Administrador</p>
            <h2>Productos e inventario</h2>
          </div>
        </div>
        <form id="product-form" class="admin-form">
          <input type="hidden" id="product-id">
          <label>
            Nombre
            <input id="product-name" required>
          </label>
          <label>
            Precio Q
            <input id="product-price" type="number" min="0" step="0.01" required>
          </label>
          <label>
            Categoria
            <input id="product-category" list="category-options" required>
            <datalist id="category-options"></datalist>
          </label>
          <label>
            Stock
            <input id="product-stock" type="number" min="0" step="1" required>
          </label>
          <div class="form-actions">
            <button type="submit">Guardar</button>
            <button id="cancel-edit" class="secondary-button" type="button">Cancelar</button>
          </div>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoria</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="admin-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
